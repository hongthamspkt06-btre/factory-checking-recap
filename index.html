<!DOCTYPE html>
<html lang="en" translate="no" class="notranslate">
<head>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Factory Checking Recap</title>
<style>
  :root{
    --bg:#D5D8DC; --panel:#ffffff; --panel2:#f2f3f5; --border:#d9dce1;
    --text:#20242c; --sub:#68707c; --amber:#b45309; --green:#15803d;
    --red:#dc2626; --red-dim:#fbe1df; --steel:#2f6fed; --navy:#1B3A63;
  }
  *{box-sizing:border-box;font-family:inherit;}
  html{background:#D5D8DC;}
  body{background:var(--bg);color:var(--text);font-family:"Segoe UI","Malgun Gothic",Arial,sans-serif;font-size:12px;margin:0;padding:0;}
  #app{max-width:1225px;margin:0 auto;padding:20px 18px 60px;}

  .app-header{background:var(--navy);color:#fff;height:56.7px;min-height:56.7px;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:0 20px;border-radius:12px;font-size:19px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin:0 0 18px 0;}
  .header-right{display:flex;align-items:center;gap:12px;text-transform:none;letter-spacing:normal;font-size:12px;font-weight:600;}
  .sync-pill{display:flex;align-items:center;gap:6px;color:#fff;}
  .dot{width:8px;height:8px;border-radius:50%;background:#4ade80;}
  .dot.saving,.dot.pending{background:#fbbf24;}
  .dot.saving{animation:pulse 1s infinite;}
  .dot.err{background:#f87171;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

  .btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--panel2);color:var(--text);border-radius:6px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s ease;white-space:nowrap;}
  .btn:hover{border-color:var(--steel);background:#e8edfc;}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  .btn-steel{background:var(--steel);border-color:var(--steel);color:#fff;}
  .btn-steel:hover{filter:brightness(1.08);background:var(--steel);color:#fff;}
  .btn-green{background:#15803d;border-color:#15803d;color:#fff;}
  .btn-green:hover{filter:brightness(1.1);background:#15803d;color:#fff;}
  .btn-red{color:var(--red);}
  .btn-danger{background:var(--red);border-color:var(--red);color:#fff;}
  .btn-danger:hover{filter:brightness(1.08);background:var(--red);color:#fff;}
  .btn-sm{padding:4px 8px;font-size:12px;}

  .panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:16px;box-shadow:0 1px 2px rgba(20,24,32,.04);}
  .empty-state{padding:36px 10px;text-align:center;color:var(--sub);font-size:13px;}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center;}
  .inline-msg{margin-top:10px;font-size:12px;padding:8px 12px;border-radius:6px;background:var(--red-dim);color:var(--red);}

  .sheet-wrap{overflow:auto;-webkit-overflow-scrolling:touch;}
  table.sheet{border-collapse:collapse;width:100%;min-width:760px;table-layout:fixed;background:#fff;}
  table.sheet th, table.sheet td{border:1px solid #000;padding:0;vertical-align:middle;}
  table.sheet .title-cell{background:#fff;text-align:center;padding:10px;}
  table.sheet .title-input{width:100%;border:none;background:transparent;text-align:center;font-size:16px;font-weight:700;outline:none;padding:4px;}
  table.sheet .title-input:focus{background:#f4f8ff;}
  table.sheet thead th.col{background:#fce4d6;font-size:14px;font-weight:700;padding:9px 6px;text-align:center;}
  table.sheet tr.band-0 td.cell{background:#fff;}
  table.sheet tr.band-1 td.cell{background:#dce6f1;}
  table.sheet tr.gstart td.cell{border-top:2px solid #000;}
  table.sheet td.num{text-align:center;font-size:14px;}
  table.sheet td.sec{background:#fff !important;}
  table.sheet td.sec textarea, table.sheet td.fnd textarea{
    width:100%;border:none;background:transparent;font-size:14px;line-height:1.4;resize:none;outline:none;
    padding:10px;display:block;overflow:hidden;min-height:72px;
  }
  table.sheet td.sec textarea{text-align:center;}
  table.sheet textarea:focus{background:#f4f8ff;box-shadow:inset 0 0 0 2px var(--steel);}
  table.sheet td.pho{padding:4px;}
  .photo-grid{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;align-items:center;}
  .pwrap{position:relative;}
  .pwrap img{display:block;max-width:100%;max-height:130px;object-fit:cover;cursor:zoom-in;}
  .pwrap.uploading img{opacity:.45;cursor:default;}
  .pwrap .badge{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#000;}
  .pwrap .px{position:absolute;top:0;right:0;background:rgba(220,38,38,.92);color:#fff;border:none;width:18px;height:18px;font-size:12px;line-height:18px;padding:0;cursor:pointer;display:none;}
  .pwrap:hover .px{display:block;}
  .photo-btns{display:flex;gap:4px;justify-content:center;margin-top:4px;}
  .photo-btns .btn{padding:3px 8px;font-size:12px;}
  .delcol{border:none !important;background:transparent !important;width:34px;text-align:center;}
  .delcol .btn{padding:2px 7px;}
  .del{opacity:.35;}
  tr:hover .del{opacity:1;}

  .modal-overlay{position:fixed;inset:0;background:rgba(20,24,32,.55);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px;}
  .modal-box{background:#fff;border-radius:12px;padding:22px 24px;max-width:320px;width:100%;text-align:center;box-shadow:0 10px 34px rgba(20,24,32,.25);}
  .modal-box p{margin:0 0 18px;font-size:13px;line-height:1.5;}
  .modal-actions{display:flex;gap:10px;justify-content:center;}
  .modal-actions .btn{flex:1;justify-content:center;}
  .viewer{background:transparent;box-shadow:none;max-width:95vw;padding:0;}
  .viewer img{max-width:95vw;max-height:85vh;border-radius:8px;display:block;margin:0 auto 12px;background:#fff;}

  @media print{
    body{background:#fff;} .app-header,.toolbar,.delcol,.photo-btns,.px,.badge{display:none !important;}
    .panel{border:none;box-shadow:none;padding:0;}
  }
</style>
</head>
<body>
<div id="app" translate="no" class="notranslate"></div>
<input type="file" id="fileUpload" accept="image/*" multiple style="display:none;">
<input type="file" id="fileCamera" accept="image/*" capture="environment" style="display:none;">

<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script>
/* ====== CONFIG: paste your Apps Script Web App URL (ends with /exec) ====== */
const GAS_API_URL = "https://script.google.com/macros/s/AKfycbz91tZWsJrt4_kXeK3cokKr5l3j15BhyOLR_Jh9tMZ32cvyR5ntyKHu4ab2YFaYwW8/exec";
/* ========================================================================= */

const MAX_PHOTO_DIM = 1024;
const PHOTO_QUALITY = 0.7;
const SAVE_DELAY_MS = 1200;
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const NOT_CONFIGURED = !GAS_API_URL || GAS_API_URL.indexOf('PASTE_YOUR') === 0;

function uid(){ return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,7); }
function esc(s){
  return (s===undefined||s===null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function defaultTitle(){
  const d = new Date();
  return 'Factory Checking Recap_' + MONTHS[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear();
}
function newRow(gid, section){ return { id: uid(), gid: gid || uid(), section: section || '', finding:'', photos:[] }; }
function photoSrc(fileId, size){ return 'https://drive.google.com/thumbnail?id=' + encodeURIComponent(fileId) + '&sz=w' + (size || 600); }

let state = {
  loaded:false, loading:true, loadError:'',
  title:'', rows:[],
  pending:{},            // rowId -> [{tmp, src}] photos currently uploading
  error:'', confirmDeleteId:null, viewerSrc:null,
  status:{ kind:'ok', text:'' }
};
let photoTargetId = null;
let dirty = false, saving = false, saveTimer = null;

/* ---------- API ---------- */
async function api(payload){
  // text/plain keeps this a "simple" request (no CORS preflight) for Apps Script
  const res = await fetch(GAS_API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  });
  if(!res.ok) throw new Error('HTTP ' + res.status);
  const out = await res.json();
  if(!out.success) throw new Error(out.error || 'Server error');
  return out;
}

/* ---------- Status pill (updated in place so typing is never interrupted) ---------- */
function setStatus(kind, text){
  state.status = { kind, text };
  const el = document.getElementById('syncPill');
  if(el) el.innerHTML = text ? `<span class="dot ${kind}"></span>${esc(text)}` : '';
}
function nowTime(){ return new Date().toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit', second:'2-digit'}); }

/* ---------- Load / save ---------- */
async function loadData(){
  state.loading = true; state.loadError = ''; render();
  try{
    const out = await api({ action:'getData' });
    const d = out.data || {};
    state.title = d.title || defaultTitle();
    state.rows = (Array.isArray(d.rows) && d.rows.length) ? d.rows.map(r => ({
      id: r.id || uid(), gid: r.gid || uid(), section: r.section || '', finding: r.finding || '',
      photos: Array.isArray(r.photos) ? r.photos : []
    })) : [newRow()];
    state.loaded = true;
    dirty = false;
    setStatus('ok', '');
  }catch(e){
    state.loadError = 'Could not load data: ' + e.message;
  }
  state.loading = false;
  render();
}

function scheduleSave(){
  if(!state.loaded) return;
  dirty = true;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flushSave, SAVE_DELAY_MS);
  setStatus('pending', 'Unsaved changes...');
}

async function flushSave(){
  if(!state.loaded || saving || !dirty) return;
  saving = true; dirty = false;
  setStatus('saving', 'Saving...');
  let ok = true;
  try{
    await api({ action:'saveData', data:{ title: state.title, rows: state.rows } });
  }catch(e){
    ok = false; dirty = true;
    setStatus('err', 'Save failed - retrying...');
    clearTimeout(saveTimer);
    saveTimer = setTimeout(flushSave, 5000);
  }
  saving = false;
  if(ok){
    if(dirty){ flushSave(); }
    else setStatus('ok', 'Saved ' + nowTime());
  }
}

/* ---------- Photos ---------- */
function compressImage(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = ()=>reject(new Error('Could not read image'));
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = ()=>reject(new Error('Invalid image file'));
      img.onload = ()=>{
        const scale = Math.min(1, MAX_PHOTO_DIM / Math.max(img.width, img.height));
        const w = Math.round(img.width*scale), h = Math.round(img.height*scale);
        const c = document.createElement('canvas'); c.width=w; c.height=h;
        const ctx = c.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,w,h); ctx.drawImage(img,0,0,w,h);
        resolve(c.toDataURL('image/jpeg', PHOTO_QUALITY));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

async function handleFiles(files){
  const rowId = photoTargetId;
  const list = Array.from(files||[]).filter(f=>f.type.indexOf('image/')===0);
  if(!rowId || !list.length) return;
  for(const f of list){
    const tmp = uid();
    try{
      const dataUrl = await compressImage(f);
      (state.pending[rowId] = state.pending[rowId] || []).push({ tmp, src: dataUrl });
      render();
      const out = await api({ action:'uploadPhoto', dataUrl });
      const row = state.rows.find(r=>r.id===rowId);
      if(row){ row.photos.push(out.fileId); scheduleSave(); }
      else api({ action:'deletePhoto', fileId: out.fileId }).catch(()=>{});
    }catch(e){
      state.error = 'Photo upload failed: ' + e.message;
    }
    state.pending[rowId] = (state.pending[rowId] || []).filter(p=>p.tmp !== tmp);
    render();
  }
}

function pendingCount(){ return Object.values(state.pending).reduce((n,a)=>n+a.length, 0); }

/* ---------- Rows ---------- */
function addRow(newSection){
  const last = state.rows[state.rows.length-1];
  state.rows.push(newSection || !last ? newRow() : newRow(last.gid, last.section));
  scheduleSave(); render();
  const tas = document.querySelectorAll('textarea.f-fnd');
  if(tas.length) tas[tas.length-1].focus();
}

function autosize(el){ el.style.height='auto'; el.style.height = Math.max(72, el.scrollHeight) + 'px'; }

/* ---------- Export Excel (same layout as the "Pre-Visiting Finding" template) ---------- */
async function fetchPhoto(fileId){
  const urls = [
    'https://lh3.googleusercontent.com/d/' + encodeURIComponent(fileId) + '=w800',
    photoSrc(fileId, 800)
  ];
  for(const u of urls){
    try{
      const res = await fetch(u, { credentials:'omit' });
      if(!res.ok) continue;
      const blob = await res.blob();
      if(!blob.type || blob.type.indexOf('image/')!==0) continue;
      const bmp = await createImageBitmap(blob);
      const ext = blob.type.indexOf('png')>=0 ? 'png' : 'jpeg';
      return { buffer: await blob.arrayBuffer(), ext, w: bmp.width, h: bmp.height };
    }catch(e){ /* try next */ }
  }
  return null;
}

async function exportExcel(){
  const btn = document.getElementById('exportBtn');
  if(typeof ExcelJS === 'undefined'){ state.error = 'Excel library failed to load. Check your connection and refresh.'; render(); return; }
  if(btn){ btn.disabled = true; btn.innerHTML = 'Exporting...'; }
  state.error = '';
  try{
    const rows = state.rows;
    // download all photos first (in parallel)
    const imgs = {};
    const ids = [...new Set(rows.flatMap(r => r.photos))];
    await Promise.all(ids.map(async id => { imgs[id] = await fetchPhoto(id); }));

    const wb = new ExcelJS.Workbook();
    const ws = wb.addWorksheet('finding', {
      pageSetup:{ paperSize:9, orientation:'portrait', fitToPage:true, fitToWidth:1, fitToHeight:0,
        margins:{ left:0.39, right:0.39, top:0.39, bottom:0.39, header:0.31, footer:0.31 } }
    });
    ws.columns = [{ width:6.14 }, { width:12.14 }, { width:45.57 }, { width:31.14 }];
    const COL_D_PX = 31.14*7 + 5, BOX_H = 87, GAP = 3;
    const FONT = { name:'Calibri', size:11 };
    const thin = { style:'thin', color:{argb:'FF000000'} }, med = { style:'medium', color:{argb:'FF000000'} };

    // Row 1: title
    ws.mergeCells('A1:D1');
    const t = ws.getCell('A1');
    t.value = state.title;
    t.font = { name:'Calibri', size:15, bold:true };
    t.alignment = { horizontal:'center', vertical:'middle' };
    ws.getRow(1).height = 31.5;

    // Row 2: column headers
    ['No.','Section','Finding','Photo'].forEach((h,i)=>{
      const c = ws.getCell(2, i+1);
      c.value = h;
      c.font = { ...FONT, bold:true };
      c.alignment = { horizontal:'center', vertical:'middle', wrapText:true };
      c.fill = { type:'pattern', pattern:'solid', fgColor:{ argb:'FFFCE4D6' } };
      c.border = { top:med, bottom:med, left:(i===0?med:thin), right:(i===3?med:thin) };
    });
    ws.getRow(2).height = 31.5;

    // Data rows
    const placements = [];
    const groups = [];   // [startRow, endRow, section]
    rows.forEach((r, i)=>{
      const rn = i + 3;
      const isStart = i===0 || rows[i-1].gid !== r.gid;
      const isEnd = i===rows.length-1 || rows[i+1].gid !== r.gid;
      if(isStart) groups.push([rn, rn, r.section]); else groups[groups.length-1][1] = rn;
      const blue = (i % 2 === 1);
      const fill = blue ? { type:'pattern', pattern:'solid', fgColor:{ argb:'FFDDEBF7' } } : undefined;

      // row height: enough for wrapped text and stacked photos
      const textLines = String(r.finding||'').split('\n').reduce((n,l)=> n + Math.max(1, Math.ceil(l.length/48)), 0);
      const textPt = textLines*15 + 8;
      const ok = r.photos.filter(p => imgs[p]);
      const photoPt = ok.length ? (ok.length*(BOX_H+GAP)+GAP)*0.75 : 0;
      const ht = Math.max(67.5, textPt, photoPt);
      ws.getRow(rn).height = ht;

      const vals = [ { formula:'ROW()-2', result:i+1 }, null, r.finding || '', '' ];
      [1,2,3,4].forEach(ci=>{
        const c = ws.getCell(rn, ci);
        if(ci!==2) c.value = vals[ci-1];
        c.font = FONT;
        c.alignment = { horizontal: ci===3 ? 'left' : 'center', vertical:'middle', wrapText:true };
        if(fill && ci!==2) c.fill = fill;
        c.border = {
          left: ci===1 ? med : thin, right: ci===4 ? med : thin,
          top: isStart ? med : thin, bottom: isEnd ? med : thin
        };
      });

      // photos (stacked vertically inside column D)
      let k = 0;
      r.photos.forEach(p=>{
        const im = imgs[p];
        if(!im){
          const link = ws.getCell(rn, 4);
          const url = 'https://drive.google.com/file/d/' + p + '/view';
          link.value = { text:'Photo (open link)', hyperlink:url };
          link.font = { ...FONT, color:{argb:'FF0563C1'}, underline:true };
          return;
        }
        const sc = Math.min((COL_D_PX-8)/im.w, BOX_H/im.h);
        const w = Math.round(im.w*sc), h = Math.round(im.h*sc);
        const id = wb.addImage({ buffer: im.buffer, extension: im.ext });
        const rowPx = ht/0.75;
        const topPx = GAP + k*(BOX_H+GAP) + (BOX_H-h)/2 + (ok.length===1 ? (rowPx-BOX_H-2*GAP)/2 : 0);
        placements.push({ id, col: 3 + (COL_D_PX-w)/2/COL_D_PX, row: (rn-1) + Math.max(0, topPx)/rowPx, w, h });
        k++;
      });
    });

    // merge Section cells per group
    groups.forEach(([a,b,sec])=>{
      if(b>a) ws.mergeCells(a,2,b,2);
      const c = ws.getCell(a,2);
      c.value = sec || '';
      c.font = FONT;
      c.alignment = { horizontal:'center', vertical:'middle', wrapText:true };
      for(let rr=a; rr<=b; rr++){
        ws.getCell(rr,2).border = { left:thin, right:thin, top: rr===a ? med : thin, bottom: rr===b ? med : thin };
      }
    });

    placements.forEach(p => ws.addImage(p.id, { tl:{ col:p.col, row:p.row }, ext:{ width:p.w, height:p.h }, editAs:'oneCell' }));

    const buf = await wb.xlsx.writeBuffer();
    const blob = new Blob([buf], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = (state.title || 'Factory Checking Recap').replace(/[\\/:*?"<>|]+/g,'_') + '.xlsx';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 4000);

    const missing = ids.filter(id => !imgs[id]).length;
    if(missing) state.error = missing + ' photo(s) could not be embedded; a link was added in the Photo cell instead.';
  }catch(e){
    state.error = 'Export failed: ' + e.message;
  }
  render();
}

/* ---------- Render ---------- */
function render(){
  const app = document.getElementById('app');
  const sx = window.scrollX, sy = window.scrollY;
  const header = `
    <div class="app-header">
      <span>Factory Checking Recap</span>
      <div class="header-right">
        <span class="sync-pill" id="syncPill">${state.status.text ? `<span class="dot ${state.status.kind}"></span>${esc(state.status.text)}` : ''}</span>
      </div>
    </div>`;

  if(NOT_CONFIGURED){
    app.innerHTML = header + `<div class="panel"><div class="empty-state">Setup needed: paste your Apps Script Web App URL into <b>GAS_API_URL</b> near the top of the script.</div></div>`;
    return;
  }
  if(state.loading || !state.loaded){
    app.innerHTML = header + `<div class="panel"><div class="empty-state">${state.loading ? 'Loading data...' : esc(state.loadError)}
      ${(!state.loading) ? '<div style="margin-top:14px;"><button class="btn btn-steel" id="retryBtn">Retry</button></div>' : ''}</div></div>`;
    const rb = document.getElementById('retryBtn'); if(rb) rb.onclick = loadData;
    return;
  }

  const rows = state.rows;
  let body = '';
  rows.forEach((r, i)=>{
    const isStart = i===0 || rows[i-1].gid !== r.gid;
    let span = 0;
    if(isStart){ for(let j=i; j<rows.length && rows[j].gid===r.gid; j++) span++; }
    const pend = state.pending[r.id] || [];
    const hasPhotos = r.photos.length || pend.length;
    body += `<tr class="band-${i%2} ${isStart?'gstart':''}">
      <td class="cell num">${i+1}</td>
      ${isStart ? `<td class="cell sec" rowspan="${span}"><textarea class="f-sec" data-gid="${r.gid}" placeholder="Section" rows="1">${esc(r.section)}</textarea></td>` : ''}
      <td class="cell fnd"><textarea class="f-fnd" data-id="${r.id}" placeholder="Type finding here..." rows="1">${esc(r.finding)}</textarea></td>
      <td class="cell pho">
        ${hasPhotos ? `<div class="photo-grid">
          ${r.photos.map((p,k)=>`<div class="pwrap"><img src="${photoSrc(p,600)}" class="ph" data-fid="${esc(p)}" alt="Photo" loading="lazy"><button class="px" data-id="${r.id}" data-k="${k}" title="Remove photo">&times;</button></div>`).join('')}
          ${pend.map(p=>`<div class="pwrap uploading"><img src="${p.src}" alt="Uploading"><div class="badge">Uploading...</div></div>`).join('')}
        </div>` : ''}
        <div class="photo-btns">
          <button class="btn btn-sm upBtn" data-id="${r.id}">&#128193; Upload</button>
          <button class="btn btn-sm camBtn" data-id="${r.id}">&#128247; Camera</button>
        </div>
      </td>
      <td class="delcol"><button class="btn btn-sm btn-red del" data-id="${r.id}" title="Delete row">&times;</button></td>
    </tr>`;
  });

  app.innerHTML = header + `
    <div class="panel">
      <div class="sheet-wrap">
        <table class="sheet">
          <colgroup><col style="width:56px"><col style="width:140px"><col><col style="width:240px"><col style="width:34px"></colgroup>
          <thead>
            <tr><th colspan="4" class="title-cell"><input type="text" class="title-input" id="titleInput" value="${esc(state.title)}"></th><th class="delcol"></th></tr>
            <tr><th class="col">No.</th><th class="col">Section</th><th class="col">Finding</th><th class="col">Photo</th><th class="delcol"></th></tr>
          </thead>
          <tbody>${body}</tbody>
        </table>
      </div>
      <div class="toolbar">
        <button class="btn btn-steel" id="addRowBtn">+ Add row</button>
        <button class="btn" id="addSecBtn">+ Add new section</button>
        <button class="btn btn-green" id="exportBtn" style="margin-left:auto;">&#11015; Export Excel</button>
      </div>
      ${state.error ? `<div class="inline-msg" id="errMsg">&#9888; ${esc(state.error)}</div>` : ''}
    </div>

    ${state.confirmDeleteId ? `
    <div class="modal-overlay"><div class="modal-box">
      <p>Are you sure you want to delete this row?</p>
      <div class="modal-actions"><button class="btn btn-danger" id="delYes">Yes</button><button class="btn" id="delNo">No</button></div>
    </div></div>` : ''}

    ${state.viewerSrc ? `
    <div class="modal-overlay" id="viewerOverlay"><div class="modal-box viewer">
      <img src="${state.viewerSrc}" alt="Photo preview"><button class="btn" id="viewerClose">Close</button>
    </div></div>` : ''}
  `;

  const $ = id => document.getElementById(id);

  $('titleInput').oninput = e => { state.title = e.target.value; scheduleSave(); };

  document.querySelectorAll('textarea').forEach(autosize);
  document.querySelectorAll('textarea.f-fnd').forEach(ta=>{
    ta.oninput = ()=>{ const r = state.rows.find(x=>x.id===ta.dataset.id); if(r){ r.finding = ta.value; scheduleSave(); } autosize(ta); };
  });
  document.querySelectorAll('textarea.f-sec').forEach(ta=>{
    ta.oninput = ()=>{ state.rows.forEach(r=>{ if(r.gid===ta.dataset.gid) r.section = ta.value; }); scheduleSave(); autosize(ta); };
  });

  document.querySelectorAll('.upBtn').forEach(b=>b.onclick=()=>{ photoTargetId=b.dataset.id; $('fileUpload').click(); });
  document.querySelectorAll('.camBtn').forEach(b=>b.onclick=()=>{ photoTargetId=b.dataset.id; $('fileCamera').click(); });
  document.querySelectorAll('.ph').forEach(im=>im.onclick=()=>{ state.viewerSrc = photoSrc(im.dataset.fid, 2000); render(); });
  document.querySelectorAll('.px').forEach(b=>b.onclick=(e)=>{
    e.stopPropagation();
    const r = state.rows.find(x=>x.id===b.dataset.id);
    if(!r) return;
    const [fid] = r.photos.splice(+b.dataset.k, 1);
    scheduleSave(); render();
    if(fid) api({ action:'deletePhoto', fileId: fid }).catch(()=>{});
  });
  document.querySelectorAll('.del').forEach(b=>b.onclick=()=>{ state.confirmDeleteId = b.dataset.id; render(); });

  $('addRowBtn').onclick = ()=>addRow(false);
  $('addSecBtn').onclick = ()=>addRow(true);
  $('exportBtn').onclick = exportExcel;

  if($('delYes')) $('delYes').onclick = ()=>{
    const row = state.rows.find(r=>r.id===state.confirmDeleteId);
    if(row) row.photos.forEach(fid => api({ action:'deletePhoto', fileId: fid }).catch(()=>{}));
    state.rows = state.rows.filter(r=>r.id!==state.confirmDeleteId);
    if(!state.rows.length) state.rows = [newRow()];
    state.confirmDeleteId = null; scheduleSave(); render();
  };
  if($('delNo')) $('delNo').onclick = ()=>{ state.confirmDeleteId=null; render(); };
  if($('viewerClose')) $('viewerClose').onclick = ()=>{ state.viewerSrc=null; render(); };
  if($('viewerOverlay')) $('viewerOverlay').onclick = e=>{ if(e.target.id==='viewerOverlay'){ state.viewerSrc=null; render(); } };

  window.scrollTo(sx, sy);
}

document.getElementById('fileUpload').onchange = e => { handleFiles(e.target.files); e.target.value=''; };
document.getElementById('fileCamera').onchange = e => { handleFiles(e.target.files); e.target.value=''; };

window.addEventListener('beforeunload', e => {
  if(dirty || saving || pendingCount()){ e.preventDefault(); e.returnValue = ''; }
});

if(NOT_CONFIGURED){ state.loading = false; render(); } else { loadData(); }
</script>
</body>
</html>
